excludes:
  paths:
  - pattern: "packages/_private/angular-demo/**"
    reason: "EXAMPLE_OF"
    comment: "Private, unpublished Angular demo app. It is removed from the pnpm
      workspace (pnpm-workspace.yaml) because it depends on
      @synergy-design-system/angular, which sets publishConfig.directory to
      dist, so pnpm links the dependency to the build output
      packages/angular/dist. ORT analyzes an unbuilt checkout; the link target
      is neither a workspace project nor an installed package, so the analyzer
      fails with \"references do not actually refer to packages:
      'NPM:@synergy-design-system:angular:'\". Outside the workspace the demo
      has no lockfile of its own; this exclude stops ORT from analyzing it as a
      separate project. @synergy-design-system/angular itself is still
      analyzed as a project from packages/angular."
  - pattern: "packages/metadata/data/**"
    reason: "DATA_FILE_OF"
    comment: "Metadata content of @synergy-design-system/metadata: snapshots of
      each Synergy package's files (including copies of their package.json),
      published for the package's query API. They are not projects; ORT's NPM
      analyzer picks the copied manifests up as standalone projects and fails
      on their workspace: specifiers (\"Unsupported URL Type workspace:\").
      The real packages are analyzed from their own directories."
